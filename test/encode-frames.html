<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>encode frames</title></head>
<body>
<!-- Renders barcode frames with the real app sender module and posts each
     frame's raw pixels to the Node harness, which turns them into a Y4M
     "fake camera" recording. -->
<canvas id="stage" width="1040" height="1040"></canvas>
<pre id="out">booting…</pre>
<script src="js/cimbar.js"></script>
<script src="js/send.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const MODE = parseInt(qs.get('mode') || '68', 10);
const SIZE = parseInt(qs.get('size') || '8192', 10);
const FRAMES = parseInt(qs.get('frames') || '24', 10);
const outEl = document.getElementById('out');
const log = m => { outEl.textContent += '\n' + m; };

function makePayload(n) {
  const b = new Uint8Array(n);
  let s = 0x12345678;
  for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; b[i] = (s >>> 16) & 0xff; }
  return b;
}

function waitReady() {
  return new Promise((res, rej) => {
    const t = setInterval(() => { if (AirCimbarSender.state.ready) { clearInterval(t); res(); } }, 60);
    setTimeout(() => { clearInterval(t); rej(new Error('wasm timeout')); }, 40000);
  });
}

(async function () {
  try {
    const payload = makePayload(SIZE);
    AirCimbarSender.init(document.getElementById('stage'));
    AirCimbarSender.setFps(1000);
    AirCimbarSender.ensureWasm();
    await waitReady();
    await AirCimbarSender.setMode(MODE);
    await AirCimbarSender.prepare(new Blob([payload]), 'camera-roundtrip.bin');

    const S = AirCimbarSender.state;
    const frames = await new Promise(resolve => {
      const acc = [];
      AirCimbarSender.on('tick', () => {
        acc.push({ buf: AirCimbar.readGLFrame(S.mod, S.canvas.width, S.canvas.height), w: S.canvas.width, h: S.canvas.height });
        if (acc.length >= FRAMES) { AirCimbarSender.stop(); resolve(acc); }
      });
      AirCimbarSender.start();
    });
    log('rendered ' + frames.length);

    for (let i = 0; i < frames.length; i++) {
      await fetch('/frame', { method: 'POST', body: frames[i].buf, headers: { 'x-w': frames[i].w, 'x-h': frames[i].h } });
    }
    await fetch('/done', { method: 'POST', body: JSON.stringify({ w: frames[0].w, h: frames[0].h, frames: frames.length, mode: MODE }) });
    log('DONE');
  } catch (e) {
    log('ERROR ' + (e && e.stack || e));
    await fetch('/error', { method: 'POST', body: String(e && e.stack || e) }).catch(() => {});
  }
})();
</script>
</body>
</html>
