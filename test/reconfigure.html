<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>reconfigure regression test</title></head>
<body>
<!--
  Regression test for: changing mode or compression *while broadcasting*
  used to abort the broadcast with "next_frame 失败 (-1)".

  Cause: cimbare_configure() discards the encoder stream (_fes = nullptr) when
  the payload no longer fills a chunk under the new settings, and
  cimbare_next_frame() returns -1 while that is true. The frame loop must stand
  down during the rebuild instead of treating it as a failure.
-->
<canvas id="stage" width="1040" height="1040"></canvas>
<pre id="out">booting…</pre>
<script src="js/cimbar.js"></script>
<script src="js/send.js"></script>
<script>
const outEl = document.getElementById('out');
const log = m => { outEl.textContent += '\n' + m; };
const errors = [];
let reconfiguringSaw = 0;

function makePayload(n) {
  const b = new Uint8Array(n); let s = 0x12345678;
  for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; b[i] = (s >>> 16) & 0xff; }
  return b;
}
function waitReady() {
  return new Promise((res, rej) => {
    const t = setInterval(() => { if (AirCimbarSender.state.ready) { clearInterval(t); res(); } }, 60);
    setTimeout(() => { clearInterval(t); rej(new Error('wasm timeout')); }, 40000);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// collect rendered frames via the sender's tick event
let frames = [];
function collect(ms) {
  return new Promise(resolve => {
    const started = performance.now();
    const grab = () => {
      const S = AirCimbarSender.state;
      frames.push({ buf: AirCimbar.readGLFrame(S.mod, S.canvas.width, S.canvas.height), w: S.canvas.width, h: S.canvas.height });
      if (performance.now() - started >= ms) { AirCimbarSender.off('tick', grab); resolve(); }
    };
    AirCimbarSender.on('tick', grab);
  });
}

(async function () {
  try {
    AirCimbarSender.on('error', (e) => errors.push(String(e && e.message || e)));
    AirCimbarSender.on('reconfiguring', (busy) => { if (busy) reconfiguringSaw++; });

    const payload = makePayload(8192);
    AirCimbarSender.init(document.getElementById('stage'));
    AirCimbarSender.setFps(30);
    AirCimbarSender.ensureWasm();
    await waitReady();

    await AirCimbarSender.setMode(66);                     // Bu
    await AirCimbarSender.prepare(new Blob([payload]), 'reconfigure.bin');
    AirCimbarSender.start();
    await collect(250);                                     // a few frames at Bu
    const beforeCount = frames.length;
    log('阶段1 (Bu): ' + beforeCount + ' 帧');

    // ---- the operation that used to kill the broadcast ----
    AirCimbarSender.setCompression(6);
    await sleep(400);
    const midError = errors.length;
    log('改压缩等级后: 运行中=' + AirCimbarSender.state.running + ' err=' + errors.length);

    // ---- and the one that clears _fes outright ----
    frames = [];
    AirCimbarSender.setMode(68);                            // -> B
    await sleep(500);
    await collect(600);
    const afterCount = frames.length;
    log('阶段2 (B): ' + afterCount + ' 帧, err=' + errors.length);

    AirCimbarSender.stop();

    const result = {
      beforeCount,
      afterCount,
      errors,
      reconfiguringEvents: reconfiguringSaw,
      stillRunningAfterCompressionChange: midError === 0,
      mode: 68,
      frames: frames.map(f => ({ b64: null, w: f.w, h: f.h })),
      payloadSha: await sha256hex(payload),
    };
    log('DONE');
    window.__result = result;
    // ship the post-reconfigure frames to the harness for decoding
    for (const f of frames) {
      await fetch('/frame', { method: 'POST', body: f.buf, headers: { 'x-w': String(f.w), 'x-h': String(f.h) } });
    }
    await fetch('/done', { method: 'POST', body: JSON.stringify({
      beforeCount, afterCount, errors, reconfiguringEvents: reconfiguringSaw,
      stillRunningAfterCompressionChange: midError === 0,
      payloadSha: result.payloadSha, mode: 68,
    }) });
  } catch (e) {
    log('ERROR ' + (e && e.stack || e));
    await fetch('/done', { method: 'POST', body: JSON.stringify({ fatal: String(e && e.stack || e) }) }).catch(() => {});
  }
})();

async function sha256hex(bytes) {
  const d = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
</script>
</body>
</html>
